name: plan

on:
  pull_request:
    branches: [main]
    paths:
      - "01_foundation/**"
      - "envs/**"
      - ".github/workflows/plan.yml"

concurrency:
  group: tf-01-foundation
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC token exchange with Azure
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: terraform plan (01_foundation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01_foundation
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false -lockfile=readonly

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -var-file=../envs/dev.tfvars -input=false -no-color

      - name: checkov (advisory for now)
        run: |
          pip install --quiet checkov
          checkov -d . --quiet --soft-fail

  cost:
      name: infracost diff
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: write
      env:
        TF_ROOT: 01_foundation
      steps:
        - uses: infracost/actions/setup@v3
          with:
            api-key: ${{ secrets.INFRACOST_API_KEY }}

        - name: checkout base branch for baseline
          uses: actions/checkout@v5
          with:
            ref: ${{ github.event.pull_request.base.ref }}

        - name: generate cost baseline
          run: infracost breakdown --path="${TF_ROOT}" --format=json --out-file=/tmp/infracost-base.json

        - name: checkout PR branch
          uses: actions/checkout@v5

        - name: cost diff against baseline
          run: infracost diff --path="${TF_ROOT}" --compare-to=/tmp/infracost-base.json --format=json --out-file=/tmp/infracost.json

        - name: comment on PR
          run: |
            infracost comment github --path=/tmp/infracost.json \
              --repo="${GITHUB_REPOSITORY}" \
              --github-token=${{ github.token }} \
              --pull-request=${{ github.event.pull_request.number }} \
              --behavior=update
