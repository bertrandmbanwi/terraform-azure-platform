name: apply-verify-destroy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: tf-platform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lifecycle:
    name: apply, verify, destroy (full platform)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: init all stacks
        run: |
          terraform -chdir=01_foundation init -input=false -lockfile=readonly
          terraform -chdir=02_cluster init -input=false -lockfile=readonly

      - name: apply 01_foundation
        run: terraform -chdir=01_foundation apply -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: apply 02_cluster
        run: terraform -chdir=02_cluster apply -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: azure login for verification
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: verify cluster against ARM and Kubernetes
        run: |
          set -euo pipefail
          RG="$(terraform -chdir=02_cluster output -raw resource_group_name)"
          CLUSTER="$(terraform -chdir=02_cluster output -raw cluster_name)"
          echo "==> Cluster: ${CLUSTER} in ${RG}"
          STATE="$(az aks show --resource-group "${RG}" --name "${CLUSTER}" --query provisioningState --output tsv)"
          [[ "${STATE}" == "Succeeded" ]] || { echo "ERROR: provisioningState is ${STATE}" >&2; exit 1; }
          az aks get-credentials --resource-group "${RG}" --name "${CLUSTER}" --overwrite-existing
          echo "==> Waiting for nodes to be Ready"
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes -o wide
          echo "==> Verification passed: cluster provisioned, nodes Ready"

      - name: capture evidence
        if: always()
        run: |
          mkdir -p evidence
          terraform -chdir=01_foundation output -json > evidence/foundation-outputs.json 2>/dev/null || true
          terraform -chdir=02_cluster output -json > evidence/cluster-outputs.json 2>/dev/null || true
          kubectl get nodes -o wide > evidence/nodes.txt 2>/dev/null || true
          kubectl get pods -A > evidence/system-pods.txt 2>/dev/null || true
          RG="$(terraform -chdir=02_cluster output -raw resource_group_name 2>/dev/null || true)"
          if [[ -n "${RG}" ]]; then
            az resource list --resource-group "${RG}" --output json > evidence/resources.json 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: evidence/

      - name: destroy 02_cluster
        if: always()
        run: terraform -chdir=02_cluster destroy -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: destroy 01_foundation
        if: always()
        run: terraform -chdir=01_foundation destroy -var-file=../envs/dev.tfvars -input=false -auto-approve
