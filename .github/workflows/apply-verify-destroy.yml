name: apply-verify-destroy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: tf-platform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lifecycle:
    name: apply, verify, destroy (full platform)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: init all stacks
        run: |
          terraform -chdir=01_foundation init -input=false -lockfile=readonly
          terraform -chdir=02_cluster init -input=false -lockfile=readonly

      - name: apply 01_foundation
        run: terraform -chdir=01_foundation apply -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: apply 02_cluster
        run: terraform -chdir=02_cluster apply -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: azure login for verification
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: verify cluster against ARM and Kubernetes
        run: |
          set -euo pipefail
          RG="$(terraform -chdir=02_cluster output -raw resource_group_name)"
          CLUSTER="$(terraform -chdir=02_cluster output -raw cluster_name)"
          echo "==> Cluster: ${CLUSTER} in ${RG}"
          STATE="$(az aks show --resource-group "${RG}" --name "${CLUSTER}" --query provisioningState --output tsv)"
          [[ "${STATE}" == "Succeeded" ]] || { echo "ERROR: provisioningState is ${STATE}" >&2; exit 1; }
          az aks get-credentials --resource-group "${RG}" --name "${CLUSTER}" --overwrite-existing
          echo "==> Waiting for nodes to be Ready"
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes -o wide
          echo "==> Verification passed: cluster provisioned, nodes Ready"

      - name: Check out gitops repo
        uses: actions/checkout@v5
        with:
          repository: bertrandmbanwi/gitops-supply-chain
          path: gitops
          fetch-depth: 1

      - name: Bootstrap Argo CD
        run: |
          set -euo pipefail
          helm version
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --version 9.5.20 \
            --namespace argocd --create-namespace \
            --values ci/argocd-values.yaml \
            --wait --timeout 6m
          echo "==> Argo CD installed and ready"

      - name: Sync apps and wait for Synced + Healthy
        run: |
          set -euo pipefail
          kubectl apply -f gitops/bootstrap/root-app.yaml
          echo "==> Waiting for the hello deployment to be rendered by Argo"
          for i in $(seq 1 30); do
            kubectl get deploy hello -n hello >/dev/null 2>&1 && break
            echo "  not yet ($i/30)"; sleep 10
          done
          kubectl wait --for=condition=Available deploy/hello -n hello --timeout=180s
          echo "==> Waiting for Argo to report Synced + Healthy"
          SYNC=""; HEALTH=""
          for i in $(seq 1 30); do
            SYNC=$(kubectl get application hello -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl get application hello -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            echo "  hello: sync=${SYNC:-?} health=${HEALTH:-?} ($i/30)"
            [[ "$SYNC" == "Synced" && "$HEALTH" == "Healthy" ]] && break
            sleep 10
          done
          [[ "$SYNC" == "Synced" && "$HEALTH" == "Healthy" ]] || {
            echo "ERROR: hello not Synced/Healthy"; kubectl describe application hello -n argocd; exit 1; }
          kubectl get applications -n argocd -o wide

      - name: Verify app is serving (in-cluster HTTP 200)
        run: |
          set -euo pipefail
          CODE=$(kubectl run curl-check --rm -i --restart=Never --quiet \
            --image=curlimages/curl:8.20.0 -- \
            curl -sS -o /dev/null -w '%{http_code}' \
            http://hello.hello.svc.cluster.local)
          echo "==> hello service returned HTTP ${CODE}"
          [[ "$CODE" == "200" ]] || { echo "ERROR: expected 200, got ${CODE}"; exit 1; }
          echo "==> Verification passed: synced, healthy, serving"

      - name: capture evidence
        if: always()
        run: |
          mkdir -p evidence
          terraform -chdir=01_foundation output -json > evidence/foundation-outputs.json 2>/dev/null || true
          terraform -chdir=02_cluster output -json > evidence/cluster-outputs.json 2>/dev/null || true
          kubectl get nodes -o wide > evidence/nodes.txt 2>/dev/null || true
          kubectl get pods -A > evidence/system-pods.txt 2>/dev/null || true
          RG="$(terraform -chdir=02_cluster output -raw resource_group_name 2>/dev/null || true)"
          if [[ -n "${RG}" ]]; then
            az resource list --resource-group "${RG}" --output json > evidence/resources.json 2>/dev/null || true
          fi
          kubectl get applications -n argocd -o yaml > evidence/argocd-applications.yaml 2>/dev/null || true
          kubectl get pods -n hello -o wide > evidence/hello-pods.txt 2>/dev/null || true
          kubectl get pods -n argocd -o wide > evidence/argocd-pods.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: evidence/

      - name: destroy 02_cluster
        if: always()
        run: terraform -chdir=02_cluster destroy -var-file=../envs/dev.tfvars -input=false -auto-approve

      - name: destroy 01_foundation
        if: always()
        run: terraform -chdir=01_foundation destroy -var-file=../envs/dev.tfvars -input=false -auto-approve
