name: janitor

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

concurrency:
  group: tf-platform
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sweep:
    name: sweep orphaned ephemeral resources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: delete resource groups tagged ephemeral=true
        run: |
          set -euo pipefail
          ORPHANS="$(az group list --tag ephemeral=true --query "[].name" --output tsv)"
          if [[ -z "${ORPHANS}" ]]; then
            echo "No orphaned ephemeral resource groups found. Nothing to do."
            exit 0
          fi
          echo "::warning::Orphaned ephemeral resource groups found: ${ORPHANS}"
          while IFS= read -r rg; do
            echo "==> Deleting ${rg}"
            az group delete --name "${rg}" --yes
          done <<< "${ORPHANS}"
          echo "Sweep complete. A destroy step failed somewhere; check recent lifecycle runs."
